# GASMP Core 0.7.0 — Paper 26.2 / Java 25
# Phase 1 gameplay systems. Rank and visual menu design are refined in Phase 2.
general:
  debug: false
  brand: "&d&lGASMP"
storage:
  type: sqlite
  sqlite-file: data.db
modules:
  player-profiles: true
  shards: true
  menus: true
  rank-admin: true
  combat: true
  economy: true
  teams: true
  auction-house: true
  battle-pass: true
  crates: true
  skills: true
  moderation: true
  holograms: true
  maintenance: true
  chat-games: true
  leaderboards: true
  casino: false
  bounties: true
menus:
  enabled: true
  sounds: true
  bedrock-vanilla-fallback: true
  main-menu-title: "&d&lGASMP &8• &5Menu"
  themes:
    main: "pink-purple-arcade"
    shop: "blue-storefront"
    statistics: "pink-statistics"
    decorations: "blue-decorations"
    music: "retro-player"
    shards: "violet-crystal"
    casino: "arcade-casino"
economy:
  enabled: true
  provider: vault
  display-name: "Coins"
shards:
  enabled: true
  display-name: "Shards"
  symbol: "✦"
  starting-balance: 0
  integer-only: true
  allow-player-to-player-transfer: false
  allow-real-money-purchase: false
  allow-cashout: false
rank-admin:
  enabled: true
  config-file: "ranks.yml"
  require-luckperms: true
  play-rank-up-cinematic: true
integrations:
  luckperms: true
  tab: true
  placeholderapi: true
  itemsadder-rank-assets: true
  rp-engine: true
  geyser-floodgate: true
  vault-economy: true
  nexo: true
  itemsadder: true
  imageframe: true
  typewriter: true
  head-database: true
  openinv: true
  libs-disguises: true
  skript: true
restricted-tools:
  crates-command:
    groups: [dev, owner]
  libs-disguises:
    groups: [dev, owner]
  headdatabase:
    groups: [builder, dev, owner]
  openinv:
    groups: [dev, admin, owner]
  skript-management:
    groups: [dev, owner]
  vanish:
    groups: [builder, dev, admin, manager, mod, helper, owner]
combat:
  tag-seconds: 15
  punish-on-logout: true
bounties:
  minimum: 100.0
  maximum: 1000000.0
auction-house:
  enabled: true
  minimum-price: 1.0
  maximum-price: 100000000.0
  listing-hours: 168
  page-size: 10
  max-active-listings-per-player: 10
  reservation-timeout-seconds: 120
battle-pass:
  enabled: true
skills:
  require-sneak: true
  vein-miner:
    enabled: true
    max-blocks: 32
  tree-capitator:
    enabled: true
    max-blocks: 64

# Advanced teams; team bank uses the same Vault Coins provider as the shop.
teams:
  initial-capacity: 8
  capacity-upgrade-cost: 5000.0
  capacity-upgrade-slots: 2
  maximum-capacity: 100
  invite-expiry-seconds: 60
  description-max-length: 100
  bank-withdrawal-roles: [LEADER, COLEADER]
  home-set-roles: [LEADER, COLEADER, OFFICER]
  max-homes-per-team: 3
  max-alliances-per-team: 5
  ally-request-expiry-seconds: 60
