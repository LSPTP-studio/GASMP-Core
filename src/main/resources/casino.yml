# The arcade is intentionally OFF by default. Currency is virtual in-server Coins via Vault.
settings:
  enabled: true
  default-bet: 10.0
  minimum-bet: 1.0
  maximum-bet: 100.0
  cooldown-seconds: 5
  real-money: false
  cashout: false
# The GUI includes game-themed spin animations. Poker and Tic-Tac-Toe are quick-match simulations, not full board games.
games:
  roulette: true
  darts: true
  drums: true
  races: true
  pyramid: true
  stairs: true
  lottery: true
  crash: true
  classic: true
  blackjack: true
  rps: true
  tictactoe-quick-match: true
  poker-quick-match: true
