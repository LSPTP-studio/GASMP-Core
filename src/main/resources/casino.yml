# GASMP Arcade enabled by default. Uses virtual Shards from the GASMP player ledger.
settings:
  enabled: true
  minimum-bet: 1
  maximum-bet: 100
  cooldown-seconds: 5
  real-money: false
  cashout: false
# The Arcade has animated solo games and 1v1 player challenges. Tic-Tac-Toe duels use a real turn-based board; Poker uses the existing quick-match hand-strength resolver. All stakes and rewards are virtual Shards.
games:
  roulette: true
  darts: true
  drums: true
  races: true
  pyramid: true
  stairs: true
  lottery: true
  crash: true
  classic: true
  blackjack: true
  rps: true
  tictactoe-quick-match: true
  poker-quick-match: true
