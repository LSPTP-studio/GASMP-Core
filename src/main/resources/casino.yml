# GASMP arcade enabled by default. Uses virtual in-server Coins via Vault only.
settings:
  enabled: true
  minimum-bet: 1
  maximum-bet: 100
  cooldown-seconds: 5
  real-money: false
  cashout: false
# The GUI includes game-themed spin animations. Poker and Tic-Tac-Toe are quick-match simulations, not full board games. A wager is a whole number of Shards.
games:
  roulette: true
  darts: true
  drums: true
  races: true
  pyramid: true
  stairs: true
  lottery: true
  crash: true
  classic: true
  blackjack: true
  rps: true
  tictactoe-quick-match: true
  poker-quick-match: true
