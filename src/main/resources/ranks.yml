rank-admin:
  admin-groups: [dev, owner]
  owner-group: owner
  developer-group: dev
  owner-only-ranks: [owner, admin, manager, dev]
  protected-target-ranks: [owner, admin, manager, dev]
  primary-rank-selection: highest-configured-weight
  prefix-priority: 100

# A player may hold one rank per track. Changing one track preserves the others.
