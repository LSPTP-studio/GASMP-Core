# GASMP CraftEngine furniture.
furniture:
  gasmp:normal_crate:
    settings:
      item: gasmp:normal_crate
      hit_times: 2
    variants:
      ground:
        elements:
          - type: item_display
            item: gasmp:normal_crate
            translation: 0,0.04,0
            scale: 0.94,0.94,0.94
        hitboxes:
          - type: interaction
            position: 0,0,0
            width: 1
            height: 1
            interactive: true
            blocks_building: true
    loot:
      template: default:loot_table/furniture
      arguments:
        item: gasmp:normal_crate
