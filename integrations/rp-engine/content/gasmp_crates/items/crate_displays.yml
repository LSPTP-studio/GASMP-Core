common_crate_display:
  material: PAPER
  name: "&f&lCOMMON CRATE DISPLAY"
  lore:
    - "&7Place this animated crate model."
    - "&8Right-click to open with a matching key."
  model: common_crate
  place:
    facing: cardinal
    scale: 1.0
    solid: true
    surface: floor
    animations:
      idle:
        mode: loop
        speed: 0.75
        priority: 1
        blend: 0.12
      open:
        mode: once
        speed: 0.9
        priority: 10
        blend: 0.15
  actions:
    interact:
      - cooldown: 2
      - cancel
      - console: "gcrateopen {player} common"

