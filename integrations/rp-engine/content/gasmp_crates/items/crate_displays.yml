vote_crate_display:
  material: PAPER
  name: "&a&lVOTE CRATE DISPLAY"
  lore:
    - "&7Place this animated crate model."
    - "&8Right-click to open with a Vote Key."
  texture: item/vote_crate_display
  model: vote_crate
  place:
    facing: cardinal
    scale: 1.0
    solid: true
    surface: floor
    animations:
      open:
        mode: once
        speed: 0.9
        priority: 10
        blend: 0.15
  actions:
    interact:
      - cooldown: 2
      - cancel
      - console: "gcrateopen {player} vote"
