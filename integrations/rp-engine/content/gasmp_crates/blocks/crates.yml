vote_crate_block:
  base: note_block
  model: vote_crate
  hardness: 4.0
  drop: gasmp_crates:vote_crate_block
  name: "&a&lVOTE CRATE"
  lore:
    - "&7Protected GASMP crate block."
    - "&8Right-click to open with a Vote Key."
  sound: minecraft:block.chest.open
  actions:
    interact:
      - cooldown: 2
      - cancel
      - console: "gcrateopen {player} vote"
