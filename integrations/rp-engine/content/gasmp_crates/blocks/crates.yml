# These are real placeable custom blocks. Each uses a Blockbench model and calls GASMP's
# internal key-checked crate opener when a player interacts with the placed block.
vote_crate_block:
  base: note_block
  model: vote_crate
  hardness: 4.0
  drop: gasmp_crates:vote_crate_block
  name: "&a&lVANGUARD SUPPLY CACHE"
  lore:
    - "&7A field cache issued to active GASMP voters."
    - "&8Right-click with a Vanguard Key to unlock."
  sound: minecraft:block.chest.open
  actions:
    interact:
      - cooldown: 2
      - cancel
      - console: "gcrateopen {player} vote"

legendary_crate_block:
  base: note_block
  model: legendary_crate
  hardness: 5.0
  drop: gasmp_crates:legendary_crate_block
  name: "&5&lABYSSAL RELIC VAULT"
  lore:
    - "&7A sealed vault containing high-tier rewards."
    - "&8Right-click with an Abyssal Key to unlock."
  sound: minecraft:block.ender_chest.open
  actions:
    interact:
      - cooldown: 2
      - cancel
      - console: "gcrateopen {player} legendary"
