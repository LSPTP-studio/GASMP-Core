name: GASMP Core Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GASMP Core (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify source project is present
        shell: bash
        run: |
          if [[ ! -f build.gradle && ! -f build.gradle.kts ]]; then
            echo "::error::GASMP source is missing. Upload the extracted project files (build.gradle.kts, settings.gradle.kts, src/, docs/, etc.) to the repository root. The repository currently has only the README and workflow."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Validate required source files
        shell: bash
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f src/main/resources/plugin.yml
          test -d src/main/java
          gradle --version
          java --version

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Verify JAR output
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "::error::Gradle completed without producing a plugin JAR."
            exit 1
          fi
          printf 'Produced: %s\n' "${jars[@]}"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GASMP-Core-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
