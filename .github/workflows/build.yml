name: GASMP Core Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GASMP Core (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Validate Gradle wrapper
        if: hashFiles('gradlew') != ''
        run: chmod +x gradlew
      - name: Build plugin
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GASMP-Core-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
