name: GASMP Core Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GASMP Core (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify source project is present
        shell: bash
        run: |
          if [[ ! -f build.gradle && ! -f build.gradle.kts ]]; then
            echo "::error::GASMP source is missing. Upload the extracted project files (build.gradle.kts, settings.gradle.kts, src/, docs/, etc.) to the repository root. The repository currently has only the README and workflow."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Validate required source files
        shell: bash
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f src/main/resources/plugin.yml
          test -d src/main/java
          gradle --version
          java --version

      - name: Validate YAML and Blockbench model files
        shell: bash
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file, aliases: true); puts "YAML OK: #{file}" }' \
            src/main/resources/*.yml \
            integrations/rp-engine/content/gasmp_furniture/*.yml \
            integrations/rp-engine/content/gasmp_furniture/items/*.yml
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          models = sorted(Path("integrations/rp-engine/content/gasmp_furniture/assets/models").glob("*.bbmodel"))
          if len(models) != 6:
              raise SystemExit(f"Expected 6 furniture Blockbench models, found {len(models)}")
          for path in models:
              with path.open(encoding="utf-8") as handle:
                  model = json.load(handle)
              if not model.get("elements") or not model.get("groups"):
                  raise SystemExit(f"Model is missing geometry or groups: {path}")
              for texture in model.get("textures", []):
                  source = texture.get("source", "")
                  if source.startswith("data:image/png;base64,"):
                      png = base64.b64decode(source.split(",", 1)[1], validate=True)
                      if not png.startswith(bytes.fromhex("89504e470d0a1a0a")):
                          raise SystemExit(f"Invalid embedded PNG in {path}")
              print(f"Blockbench JSON and textures OK: {path}")
          PY

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Verify JAR output
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if (( ${#jars[@]} == 0 )); then
            echo "::error::Gradle completed without producing a plugin JAR."
            exit 1
          fi
          printf 'Produced: %s\n' "${jars[@]}"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: GASMP-Core-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload RP Engine furniture pack
        uses: actions/upload-artifact@v4
        with:
          name: GASMP-RPEngine-Furniture
          path: integrations/rp-engine/content/gasmp_furniture/
          if-no-files-found: error
          retention-days: 14
