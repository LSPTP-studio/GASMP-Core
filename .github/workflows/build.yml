name: GASMP Core — ItemsAdder 4.0.18 Dual Paper Build

on:
  push:
    branches:
      - main
      - itemsadder-4.0.18-edition-0.8.3
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Paper ${{ matrix.paper_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper_api_version: '26.2.build.+'
            paper_target: 'paper-26.2'
            server_role: 'official'
          - paper_api_version: '26.3.build.+'
            paper_target: 'paper-26.3'
            server_role: 'compile-test-only'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Verify target metadata
        shell: bash
        run: |
          echo "Plugin version: 0.8.3 (unchanged)"
          echo "Paper API line: ${{ matrix.paper_api_version }}"
          echo "Target: ${{ matrix.paper_target }} (${{ matrix.server_role }})"
          test -f build.gradle.kts
          test -f src/main/resources/plugin.yml
          test -d src/main/java

      - name: Build plugin
        run: >-
          gradle --no-daemon clean build
          -PreleaseVersion=0.8.3
          -PpaperApiVersion="${{ matrix.paper_api_version }}"
          -PpaperTarget="${{ matrix.paper_target }}"

      - name: Verify plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/GASMP-Core-0.8.3-${{ matrix.paper_target }}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          unzip -p "$JAR" plugin.yml | grep -q "version: '0.8.3'"
          unzip -p "$JAR" plugin.yml | grep -q "api-version: '26.2'"
          echo "Verified: $JAR"

      - name: Assemble install package
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.paper_target }}"
          JAR="build/libs/GASMP-Core-0.8.3-${TARGET}.jar"
          ROOT="dist/GASMP-Core-0.8.3-${TARGET}"
          mkdir -p "$ROOT/plugins/ItemsAdder/contents"
          cp "$JAR" "$ROOT/plugins/"
          cp -a integrations/itemsadder/contents/gasmp "$ROOT/plugins/ItemsAdder/contents/"
          cp -a integrations/itemsadder/contents/gasmp_ranks "$ROOT/plugins/ItemsAdder/contents/"
          cp README.md "$ROOT/"
          cp docs/COMMANDS.md "$ROOT/"
          cat > "$ROOT/INSTALL.txt" <<EOF
          GASMP CORE 0.8.3 — ${TARGET}
          =================================
          Server target: Paper ${{ matrix.paper_target == 'paper-26.2' && '26.2 OFFICIAL' || '26.3 TEST' }}
          Plugin version: 0.8.3 (unchanged)
          Java: 25
          Required: ItemsAdder 4.0.18, Vault, LuckPerms and a Vault economy provider.

          INSTALL
          1. Stop the target server and back up plugins/GASMP-Core/ and plugins/ItemsAdder/.
          2. Copy the JAR from plugins/ into the server plugins/ folder.
          3. Merge the ItemsAdder contents folder into plugins/ItemsAdder/contents/.
          4. Start the server and check the console for GASMP or ItemsAdder errors.
          5. Run /iareload, then /iazip, and make sure clients accept the ItemsAdder pack. VoidRP UI sends a separate pack when installed; clients must accept that too.
          6. Optional: install VoidRP UI 0.4.0 as a separate plugin JAR.\n          7. Test menus, purchases and teleports before using the build on a live server.\n\n          ItemsAdder 4.0.18 documents Paper 26.2 compatibility. The 26.3 artifact is compile/test only.

          This package is built for the ${{ matrix.paper_target }} API line.
          Do not put the Paper 26.3 compile/test only build on the official Paper 26.2 server.
          EOF
          (cd dist && zip -qr "GASMP-Core-0.8.3-${TARGET}-Full-Package.zip" "GASMP-Core-0.8.3-${TARGET}")
          test -s "dist/GASMP-Core-0.8.3-${TARGET}-Full-Package.zip"

      - name: Upload JAR and install package
        uses: actions/upload-artifact@v4
        with:
          name: GASMP-Core-0.8.3-${{ matrix.paper_target }}
          path: |
            build/libs/GASMP-Core-0.8.3-${{ matrix.paper_target }}.jar
            dist/GASMP-Core-0.8.3-${{ matrix.paper_target }}-Full-Package.zip
          if-no-files-found: error
          retention-days: 30
