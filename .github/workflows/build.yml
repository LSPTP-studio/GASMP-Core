name: GASMP Core — ItemsAdder 4.0.18 Dual Paper Build

on:
  push:
    branches:
      - main
      - itemsadder-4.0.18-edition-0.8.3
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for Paper ${{ matrix.paper_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper_api_version: '26.2.build.+'
            paper_target: 'paper-26.2'
            server_role: 'official'
          - paper_api_version: '26.3.build.+'
            paper_target: 'paper-26.3'
            server_role: 'compile-test-only'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Verify target metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle.kts
          test -f src/main/resources/plugin.yml
          test -d integrations/itemsadder/contents/gasmp
          ! grep -Ril "craftengine" src/main README.md docs integrations

      - name: Build plugin
        run: >-
          gradle --no-daemon clean build
          -PreleaseVersion=0.8.3
          -PpaperApiVersion="${{ matrix.paper_api_version }}"
          -PpaperTarget="${{ matrix.paper_target }}"

      - name: Verify plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/GASMP-Core-0.8.3-${{ matrix.paper_target }}.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q '^net/gasmp/core/ui/GASMPCustomUi.class$'
          jar tf "$JAR" | grep -q '^net/gasmp/core/ui/GASMPHomePage.class$'
          unzip -p "$JAR" plugin.yml | grep -q "version: '0.8.3'"
          unzip -p "$JAR" plugin.yml | grep -q "ItemsAdder"
          ! unzip -p "$JAR" plugin.yml | grep -qi "CraftEngine"

      - name: Assemble install package
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.paper_target }}"
          JAR="build/libs/GASMP-Core-0.8.3-${TARGET}.jar"
          ROOT="dist/GASMP-Core-0.8.3-${TARGET}"
          mkdir -p "$ROOT/plugins/ItemsAdder/contents"
          cp "$JAR" "$ROOT/plugins/"
          cp -a integrations/itemsadder/contents/gasmp "$ROOT/plugins/ItemsAdder/contents/"
          cp -a integrations/itemsadder/contents/gasmp_ranks "$ROOT/plugins/ItemsAdder/contents/"
          cp README.md "$ROOT/"
          cp docs/COMMANDS.md "$ROOT/"
          cat > "$ROOT/INSTALL.txt" <<EOF
          GASMP CORE 0.8.3 — ITEMSADDER 4.0.18 EDITION
          ============================================
          Target: Paper ${{ matrix.paper_target == 'paper-26.2' && '26.2 OFFICIAL' || '26.3 COMPILE/TEST ONLY' }}
          Runtime: Java 25
          Required: ItemsAdder 4.0.18, Vault + Vault Economy provider, LuckPerms.
          Optional dashboard: VoidRP UI 0.4.0 (separate plugin JAR).

          INSTALL
          1. Stop the server and back up worlds, plugins/GASMP-Core/ and its SQLite database.
          2. Install the original ItemsAdder 4.0.18 JAR directly in plugins/.
          3. Start once, let ItemsAdder create plugins/ItemsAdder/, then stop the server.
          4. Copy gasmp/ and gasmp_ranks/ into plugins/ItemsAdder/contents/.
          5. Copy the GASMP Core JAR directly into plugins/.
          6. Install Vault, a Vault Economy provider and LuckPerms.
          7. Optional: install VoidRP UI 0.4.0 as a separate plugin JAR.
          8. Start the server; run /iareload and then /iazip.
          9. Ensure players accept the ItemsAdder pack. VoidRP UI sends a separate pack; accept that too.

          COMPATIBILITY
          ItemsAdder 4.0.18's published compatibility list documents Paper 26.2.
          The Paper 26.3 JAR is compile/test only and is not runtime-certified with ItemsAdder 4.0.18.
          EOF
          (cd dist && zip -qr "GASMP-Core-0.8.3-${TARGET}-Full-Package.zip" "GASMP-Core-0.8.3-${TARGET}")
          test -s "dist/GASMP-Core-0.8.3-${TARGET}-Full-Package.zip"

      - name: Upload JAR and install package
        uses: actions/upload-artifact@v4
        with:
          name: GASMP-Core-0.8.3-${{ matrix.paper_target }}-ItemsAdder-4.0.18
          path: |
            build/libs/GASMP-Core-0.8.3-${{ matrix.paper_target }}.jar
            dist/GASMP-Core-0.8.3-${{ matrix.paper_target }}-Full-Package.zip
          if-no-files-found: error
          retention-days: 30
